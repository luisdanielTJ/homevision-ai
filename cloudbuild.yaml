steps:
  # --- Lint & test ---
  - name: "python:3.11-slim"
    id: install-deps
    entrypoint: pip
    args: ["install", "uv"]

  - name: "python:3.11-slim"
    id: lint
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install uv -q
        uv sync --all-groups
        uv run ruff check .
    waitFor: ["install-deps"]

  - name: "python:3.11-slim"
    id: test
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install uv -q
        uv sync --all-groups
        uv run pytest --tb=short -q
    waitFor: ["lint"]

  # --- Build & push service images ---
  - name: "gcr.io/cloud-builders/docker"
    id: build-inference
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/homevision-ai/inference_service:${SHORT_SHA}"
      - services/inference_service
    waitFor: ["test"]

  - name: "gcr.io/cloud-builders/docker"
    id: build-behavior
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/homevision-ai/behavior_engine:${SHORT_SHA}"
      - services/behavior_engine
    waitFor: ["test"]

  - name: "gcr.io/cloud-builders/docker"
    id: build-notification
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/homevision-ai/notification_service:${SHORT_SHA}"
      - services/notification_service
    waitFor: ["test"]

  - name: "gcr.io/cloud-builders/docker"
    id: build-dashboard
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/homevision-ai/dashboard:${SHORT_SHA}"
      - dashboard
    waitFor: ["test"]

  # --- Push images ---
  - name: "gcr.io/cloud-builders/docker"
    id: push-inference
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/homevision-ai/inference_service:${SHORT_SHA}"
    waitFor: ["build-inference"]

  - name: "gcr.io/cloud-builders/docker"
    id: push-behavior
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/homevision-ai/behavior_engine:${SHORT_SHA}"
    waitFor: ["build-behavior"]

  - name: "gcr.io/cloud-builders/docker"
    id: push-notification
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/homevision-ai/notification_service:${SHORT_SHA}"
    waitFor: ["build-notification"]

  - name: "gcr.io/cloud-builders/docker"
    id: push-dashboard
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/homevision-ai/dashboard:${SHORT_SHA}"
    waitFor: ["build-dashboard"]

  # --- Deploy to Cloud Run ---
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-inference
    entrypoint: gcloud
    args:
      - run
      - deploy
      - inference-service
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/homevision-ai/inference_service:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
    waitFor: ["push-inference"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-behavior
    entrypoint: gcloud
    args:
      - run
      - deploy
      - behavior-engine
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/homevision-ai/behavior_engine:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
    waitFor: ["push-behavior"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-notification
    entrypoint: gcloud
    args:
      - run
      - deploy
      - notification-service
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/homevision-ai/notification_service:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
    waitFor: ["push-notification"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-dashboard
    entrypoint: gcloud
    args:
      - run
      - deploy
      - homevision-dashboard
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/homevision-ai/dashboard:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
    waitFor: ["push-dashboard"]

substitutions:
  _REGION: northamerica-northeast1

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
