[project]
name = "homevision-ai"
version = "0.1.0"
description = "Real-time customer assistance detection for Home Depot Canada"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
]

[dependency-groups]
frame-publisher = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.10.0.84",
    "numpy>=1.26.4",
    "google-cloud-pubsub>=2.21.4",
]
inference-service = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "google-cloud-pubsub>=2.21.4",
    "google-cloud-aiplatform>=1.57.0",
    "httpx>=0.27.0",
]
behavior-engine = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "google-cloud-pubsub>=2.21.4",
    "google-cloud-aiplatform>=1.57.0",
    "httpx>=0.27.0",
]
notification-service = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "websockets>=12.0",
    "google-cloud-pubsub>=2.21.4",
    "google-cloud-firestore>=2.16.0",
    "httpx>=0.27.0",
]
dashboard = [
    "streamlit>=1.35.0",
    "websockets>=12.0",
    "google-cloud-firestore>=2.16.0",
    "google-cloud-aiplatform>=1.57.0",
    "altair>=5.3.0",
    "pandas>=2.2.2",
    "opencv-python-headless>=4.10.0.84",
]
ml = [
    "ultralytics>=8.2.18",
    "google-cloud-storage>=2.17.0",
    "google-cloud-aiplatform>=1.57.0",
    "kfp>=2.7.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.4",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["services", "ml"]
python_files = "test_*.py"
python_functions = "test_*"
pythonpath = [
    "services/frame_publisher",
    "services/inference_service",
    "services/behavior_engine",
    "services/notification_service",
]
